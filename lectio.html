  $('btn-pin-page').addEventListener('click', function(){
    if (!currentBookId || !db) return;
    db.collection('books').doc(currentBookId).update({pinnedPage: currentPage}).then(function(){
      showToast('Marcador guardado en la página ' + currentPage + '.');
    }).catch(function(e){ console.error(e); showToast('No se pudo guardar el marcador.', 'error'); });
  });

  // ---------- escuchar (text-to-speech) ----------
  var listenActive = false, autoSpeakArmed = false, spanishVoice = null;
  function pickSpanishVoice(){
    if (spanishVoice !== null) return spanishVoice;
    try{
      var voices = window.speechSynthesis.getVoices() || [];
      spanishVoice = voices.filter(function(v){ return /^es/i.test(v.lang); })[0] || false;
    } catch(e){ spanishVoice = false; }
    return spanishVoice;
  }
  if (window.speechSynthesis){
    window.speechSynthesis.onvoiceschanged = function(){ spanishVoice = null; };
  }
  function updateListenStatus(){
    var state = pdfState[currentBookId];
    $('listen-status').textContent = '🔊 Escuchando — pág. ' + currentPage + (state ? (' de ' + state.numPages) : '');
  }
  function speakPageText(text){
    if (!listenActive) return;
    window.speechSynthesis.cancel();
    text = (text||'').trim();
    if (!text || text.indexOf('no tiene texto seleccionable') !== -1 || text.indexOf('No pudimos leer esta página') !== -1 || text === 'Cargando página…'){
      advanceAndSpeak();
      return;
    }
    var utter = new SpeechSynthesisUtterance(text);
    var voice = pickSpanishVoice();
    if (voice){ utter.voice = voice; utter.lang = voice.lang; } else { utter.lang = 'es-ES'; }
    utter.onend = function(){ if (listenActive) advanceAndSpeak(); };
    utter.onerror = function(){ if (listenActive) advanceAndSpeak(); };
    updateListenStatus();
    window.speechSynthesis.speak(utter);
  }
  function advanceAndSpeak(){
    if (!listenActive) return;
    var state = pdfState[currentBookId];
    var atEnd = state && currentPage >= state.numPages;
    if (atEnd && !getSiblingPart(currentBookId, 1)){
      stopListening();
      showToast('Terminaste la lectura. 🎉');
      return;
    }
    autoSpeakArmed = true;
    goNextPage();
  }
  function startListening(){
    if (!('speechSynthesis' in window)){
      showToast('Tu navegador no permite leer en voz alta.', 'error');
      return;
    }
    var state = pdfState[currentBookId];
    if (state && state.outline && state.outline.length){
      var sorted = state.outline.slice().sort(function(a,b){ return (a.page||0)-(b.page||0); });
      var firstReal = sorted.filter(function(it){ return it.page!=null && !/^--.*--$/.test(it.title.trim()); })[0];
      if (firstReal && currentPage < firstReal.page){
        listenActive = true;
        autoSpeakArmed = true;
        $('listen-bar').hidden = false;
        updateListenStatus();
        showToast('Arrancamos en "' + firstReal.title + '" — salteamos portada/índice.');
        showPage(currentBookId, firstReal.page);
        return;
      }
    }
    listenActive = true;
    $('listen-bar').hidden = false;
    updateListenStatus();
    speakPageText($('reader-text').textContent);
  }
  function stopListening(){
    listenActive = false;
    autoSpeakArmed = false;
    try{ window.speechSynthesis.cancel(); }catch(e){}
    $('listen-bar').hidden = true;
  }
  $('btn-listen').addEventListener('click', startListening);
  $('btn-listen-stop').addEventListener('click', stopListening);
  $('btn-close-search').addEventListener('click', function(){ searchState.cancelled = true; $('modal-search').hidden = true; });
  $('input-search-query').addEventListener('keydown', function(e){
    if (e.key==='Enter'){ e.preventDefault(); if (!searchState.running) runSearch(); }
  });
  $('btn-run-search').addEventListener('click', function(){
    if (searchState.running){ searchState.cancelled = true; return; }
    runSearch();
  });

  function appendSearchResults(book, hits){
    var list = $('search-results');
    var group = document.createElement('div'); group.className = 'search-group';
    var h = document.createElement('h3'); h.className = 'search-group-title';
    h.textContent = book.title + ' (' + hits.length + (hits.length===1 ? ' resultado' : ' resultados') + ')';
    group.appendChild(h);
    hits.slice(0,50).forEach(function(hit){
      var item = document.createElement('button');
      item.type = 'button'; item.className = 'search-hit-item';
      var pageTag = document.createElement('span'); pageTag.className = 'search-hit-page'; pageTag.textContent = 'pág. ' + hit.page;
      var snippetEl = document.createElement('span'); snippetEl.className = 'search-hit-snippet'; snippetEl.textContent = hit.snippet;
      item.appendChild(pageTag); item.appendChild(snippetEl);
      item.addEventListener('click', function(){
        searchState.cancelled = true;
        $('modal-search').hidden = true;
        jumpToBookPage(book.id, hit.page);
      });
      group.appendChild(item);
    });
    if (hits.length > 50){
      var more = document.createElement('div'); more.className = 'search-hit-more';
      more.textContent = '+ ' + (hits.length-50) + ' resultados más en este libro';
      group.appendChild(more);
    }
    list.appendChild(group);
  }

  function runSearch(){
    var query = $('input-search-query').value.trim();
    if (!query) return;
    var scope = $('search-scope').value;
    var targets = scope ? books.filter(function(b){ return b.id===scope; }) : books.slice();
    if (!targets.length){ $('search-progress').textContent = 'No hay libros para buscar.'; return; }
    searchState.cancelled = false;
    searchState.running = true;
    $('search-results').innerHTML = '';
    $('btn-run-search').textContent = 'Cancelar';
    var nq = normalizeForSearch(query);
    var totalHits = 0;

    function sleep0(){ return new Promise(function(r){ setTimeout(r, 0); }); }

    function processBook(bi){
      if (bi >= targets.length || searchState.cancelled) return Promise.resolve();
      var book = targets[bi];
      $('search-progress').textContent = 'Abriendo "' + book.title + '"…';
      return ensurePdfLoaded(book).then(function(){
        var state = pdfState[book.id];
        if (!state || state.error) return;
        var hitsForBook = [];
        function processPage(p){
          if (p > state.numPages || searchState.cancelled) return Promise.resolve();
          $('search-progress').textContent = 'Indexando "' + book.title + '"… ' + p + '/' + state.numPages;
          var text = state.textCache[p];
          var textPromise;
          if (text === undefined){
            textPromise = state.pdfDoc.getPage(p).then(function(page){ return page.getTextContent(); }).then(function(tc){
              var t = tc.items.map(function(it){ return it.str + (it.hasEOL?'\n':''); }).join('');
              t = t.replace(/[ \t]+/g,' ').replace(/\n{3,}/g,'\n\n').trim();
              state.textCache[p] = t;
              return t;
            }).catch(function(){ return ''; });
          } else {
            textPromise = Promise.resolve(text);
          }
          return textPromise.then(function(t){
            if (t){
              var nt = normalizeForSearch(t);
              var idx = nt.indexOf(nq);
              if (idx !== -1){
                var snippetStart = Math.max(0, idx-50);
                var snippet = (snippetStart>0?'…':'') + t.slice(snippetStart, idx+nq.length+60) + '…';
                hitsForBook.push({page:p, snippet:snippet});
                totalHits++;
              }
            }
            return (p % 15 === 0) ? sleep0().then(function(){ return processPage(p+1); }) : processPage(p+1);
          });
        }
        return processPage(1).then(function(){
          if (hitsForBook.length) appendSearchResults(book, hitsForBook);
        });
      }).then(function(){ return processBook(bi+1); });
    }

    processBook(0).then(function(){
      $('search-progress').textContent = searchState.cancelled
        ? 'Búsqueda cancelada.'
        : (totalHits ? (totalHits + (totalHits===1?' resultado.':' resultados.')) : 'No se encontró nada con esas palabras.');
      $('btn-run-search').textContent = 'Buscar';
      searchState.running = false;
    });
  }

  function showPage(bookId, pageNum){
    var state = pdfState[bookId];
    if (!state || !state.pdfDoc) return;
    pageNum = Math.max(1, Math.min(state.numPages, pageNum));
    currentPage = pageNum;
    var myToken = ++showPageToken;
    $('input-page-jump').value = pageNum;
    $('btn-prev-page').disabled = pageNum<=1 && !getSiblingPart(bookId, -1);
    $('btn-next-page').disabled = pageNum>=state.numPages && !getSiblingPart(bookId, 1);

    var container = $('reader-text');
    var cached = state.textCache[pageNum];
    var ready = function(text){
      if (myToken !== showPageToken) return;
      if (currentRoute() !== 'libro-' + bookId) return;
      var pageHighlights = highlights.filter(function(h){ return h.bookId===bookId && h.page===pageNum; });
      if (transientHighlight && transientHighlight.bookId===bookId && transientHighlight.page===pageNum){
        pageHighlights = pageHighlights.concat([{text: transientHighlight.text, tag: 'cita'}]);
        transientHighlight = null;
      }
      renderPageWithHighlights(container, text, pageHighlights);
      scheduleLastPageUpdate(bookId, pageNum);
      if (autoSpeakArmed){ autoSpeakArmed = false; speakPageText(text); }
    };
    if (cached !== undefined){ ready(cached); return; }
    container.textContent = 'Cargando página…';
    state.pdfDoc.getPage(pageNum).then(function(page){ return page.getTextContent(); }).then(function(tc){
      var text = tc.items.map(function(it){ return it.str + (it.hasEOL ? '\n' : ''); }).join('');
      text = text.replace(/[ \t]+/g, ' ').replace(/\n{3,}/g, '\n\n').trim();
      if (!text) text = '(Esta página no tiene texto seleccionable — puede ser una imagen escaneada.)';
      state.textCache[pageNum] = text;
      ready(text);
    }).catch(function(e){
      console.error(e);
      if (myToken === showPageToken) container.textContent = 'No pudimos leer esta página.';
    });
  }

  function renderPageWithHighlights(container, text, pageHighlights){
    container.textContent = '';
    if (!pageHighlights.length){ container.textContent = text; return; }
    var matches = [];
    pageHighlights.forEach(function(h){
      var idx = text.indexOf(h.text);
      if (idx !== -1) matches.push({start: idx, end: idx + h.text.length, h: h});
    });
    matches.sort(function(a,b){ return a.start - b.start; });
    var filtered = []; var lastEnd = -1;
    matches.forEach(function(m){ if (m.start >= lastEnd){ filtered.push(m); lastEnd = m.end; } });
    var cursor = 0;
    filtered.forEach(function(m){
      if (m.start > cursor) container.appendChild(document.createTextNode(text.slice(cursor, m.start)));
      var mk = document.createElement('mark');
      mk.className = 'hl' + (m.h.tag ? ' hl-' + m.h.tag : '');
      mk.textContent = text.slice(m.start, m.end);
      if (m.h.id){
        mk.title = 'Ver en el cuaderno';
        mk.addEventListener('click', function(){ location.hash = 'cuaderno'; });
      }
      container.appendChild(mk);
      cursor = m.end;
    });
    if (cursor < text.length) container.appendChild(document.createTextNode(text.slice(cursor)));
  }

  var lastPageTimer = null;
  function scheduleLastPageUpdate(bookId, pageNum){
    clearTimeout(lastPageTimer);
    lastPageTimer = setTimeout(function(){
      var book = books.filter(function(b){ return b.id===bookId; })[0];
      if (book && book.lastPage !== pageNum){
        db.collection('books').doc(bookId).update({lastPage: pageNum}).catch(function(){});
      }
    }, 600);
  }

  $('btn-prev-page').addEventListener('click', goPrevPage);
  $('btn-next-page').addEventListener('click', goNextPage);
  $('input-page-jump').addEventListener('change', function(e){
    var n = parseInt(e.target.value, 10);
    if (!isNaN(n)) showPage(currentBookId, n);
  });
  document.addEventListener('keydown', function(e){
    if (currentRoute().indexOf('libro-')!==0) return;
    var tag = e.target && e.target.tagName;
    if (tag==='INPUT' || tag==='TEXTAREA') return;
    if (e.key==='ArrowLeft') goPrevPage();
    if (e.key==='ArrowRight') goNextPage();
  });

  // ---------- selection -> highlight toolbar ----------
  function hideSelectionToolbar(){ $('selection-toolbar').hidden = true; pendingSelection = null; }
  function handleSelectionCheck(){
    var sel = window.getSelection();
    var text = sel && sel.toString().trim();
    var container = $('reader-text');
    if (!text || !sel.rangeCount || container.hidden || !container.contains(sel.anchorNode)){ hideSelectionToolbar(); return; }
    var range = sel.getRangeAt(0);
    var rect = range.getBoundingClientRect();
    if (rect.width===0 && rect.height===0){ hideSelectionToolbar(); return; }
    pendingSelection = {text: text, page: currentPage, bookId: currentBookId};
    var toolbar = $('selection-toolbar');
    toolbar.hidden = false;
    var top = window.scrollY + rect.top - toolbar.offsetHeight - 10;
    var left = window.scrollX + rect.left;
    var maxLeft = window.scrollX + document.documentElement.clientWidth - toolbar.offsetWidth - 8;
    left = Math.max(8, Math.min(left, maxLeft));
    toolbar.style.top = Math.max(8, top) + 'px';
    toolbar.style.left = left + 'px';
  }
  document.addEventListener('mouseup', function(){ setTimeout(handleSelectionCheck, 0); });
  document.addEventListener('touchend', function(){ setTimeout(handleSelectionCheck, 80); });

  $('selection-toolbar').addEventListener('click', function(e){
    var btn = e.target.closest ? e.target.closest('.sel-btn') : null;
    if (!btn || !pendingSelection) return;
    var action = btn.dataset.action;
    var sel = pendingSelection;
    if (action==='mark'){
      saveHighlight(sel).then(function(){
        hideSelectionToolbar(); window.getSelection().removeAllRanges();
        showToast('Marcado. Lo tenés en tu Cuaderno.');
      });
    } else if (action==='note'){
      openNoteComposer(sel, null);
    } else if (action==='ai'){
      requestAiForSelection(sel, btn);
    }
  });

  function saveHighlight(data){
    if (!db) return Promise.reject();
    var book = books.filter(function(b){ return b.id===data.bookId; })[0];
    var id = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now())+Math.random().toString(16).slice(2));
    var doc = {
      bookId: data.bookId, bookTitle: book ? book.title : '', page: data.page,
      text: data.text, tag: data.tag || null, note: data.note || null,
      aiSummary: data.aiSummary || null, createdAt: Date.now()
    };
    return db.collection('highlights').doc(id).set(doc).then(function(){ return id; });
  }

  function buildSummaryPrompt(passage, bookTitle){
    return 'Sos un guía de estudio bíblico católico, cálido y claro. Una persona subrayó este pasaje ' +
      'porque le pareció importante, del libro "' + bookTitle + '".\n\n' +
      'Escribí, en español (tono argentino, de "vos"), un resumen breve de 2 a 4 oraciones: la idea ' +
      'central del pasaje y por qué puede ser relevante para la vida espiritual, sin inventar citas ni ' +
      'afirmaciones doctrinales que no estén en el texto.\n\nPasaje:\n"""' + passage + '"""\n\n' +
      'Respondé solo con el resumen, sin introducciones ni encabezados.';
  }
  function sampleErrorMessage(e){
    var map = {
      not_granted: 'No diste permiso para usar la IA en esta página.',
      rate_limited: 'Estás pidiendo demasiados resúmenes seguidos. Probá en un rato.',
      prompt_too_large: 'El pasaje es demasiado largo para resumir de una.',
      refused: 'La IA no pudo generar un resumen para este contenido.',
      empty_completion: 'No se generó ningún resumen. Probá de nuevo.'
    };
    return (e && map[e.code]) || 'No se pudo generar el resumen. Probá de nuevo.';
  }
  function requestAiForSelection(sel, btn){
    if (!sampleFn){ showToast('El resumen con IA no está disponible acá.', 'error'); return; }
    var book = books.filter(function(b){ return b.id===sel.bookId; })[0];
    btn.disabled = true; var orig = btn.textContent; btn.textContent = 'Pensando…';
    sampleFn(buildSummaryPrompt(sel.text, book ? book.title : '')).then(function(result){
      return saveHighlight({text: sel.text, page: sel.page, bookId: sel.bookId, aiSummary: result.text});
    }).then(function(){
      hideSelectionToolbar(); window.getSelection().removeAllRanges();
      showToast('Resumen guardado en tu Cuaderno.');
    }).catch(function(e){
      console.error(e); showToast(sampleErrorMessage(e), 'error');
    }).finally(function(){ btn.disabled = false; btn.textContent = orig; });
  }
  function requestAiForExisting(h, btn){
    if (!sampleFn){ showToast('El resumen con IA no está disponible acá.', 'error'); return; }
    btn.disabled = true; var orig = btn.textContent; btn.textContent = 'Pensando…';
    sampleFn(buildSummaryPrompt(h.text, h.bookTitle)).then(function(result){
      return db.collection('highlights').doc(h.id).update({aiSummary: result.text});
    }).then(function(){ showToast('Resumen agregado.'); })
    .catch(function(e){ console.error(e); showToast(sampleErrorMessage(e), 'error'); })
    .finally(function(){ btn.disabled = false; btn.textContent = orig; });
  }

  // ---------- note modal ----------
  function openNoteComposer(sel, existingHighlightId){
    var preview = $('note-passage-preview'), textarea = $('input-note-text');
    if (existingHighlightId){
      var h = highlights.filter(function(x){ return x.id===existingHighlightId; })[0];
      if (!h) return;
      noteContext = {mode:'edit', id: existingHighlightId};
      preview.textContent = h.text; textarea.value = h.note || '';
    } else {
      noteContext = {mode:'new', sel: sel};
      preview.textContent = sel.text; textarea.value = '';
    }
    $('modal-note').hidden = false;
    textarea.focus();
  }
  $('btn-cancel-note').addEventListener('click', function(){ $('modal-note').hidden = true; noteContext = null; });
  $('btn-save-note').addEventListener('click', function(){
    var text = $('input-note-text').value.trim();
    if (!noteContext) return;
    var p;
    if (noteContext.mode==='new'){
      p = saveHighlight({text: noteContext.sel.text, page: noteContext.sel.page, bookId: noteContext.sel.bookId, note: text || null})
        .then(function(){ hideSelectionToolbar(); window.getSelection().removeAllRanges(); });
    } else {
      p = db.collection('highlights').doc(noteContext.id).update({note: text || null});
    }
    p.then(function(){ $('modal-note').hidden = true; noteContext = null; showToast('Nota guardada.'); })
     .catch(function(e){ console.error(e); showToast('No se pudo guardar la nota.', 'error'); });
  });

  // ---------- cuaderno ----------
  function goToHighlightInBook(h){ jumpToBookPage(h.bookId, h.page); }

  function populateFilterOptions(){
    var sel = $('filter-book');
    var prev = sel.value;
    var seen = [];
    var seenIds = {};
    highlights.forEach(function(h){
      if (h.bookId && !seenIds[h.bookId]){ seenIds[h.bookId]=true; seen.push({id:h.bookId, title:h.bookTitle}); }
    });
    sel.innerHTML = '';
    var optAll = document.createElement('option'); optAll.value=''; optAll.textContent='Todos los libros';
    sel.appendChild(optAll);
    seen.forEach(function(s){
      var o = document.createElement('option'); o.value = s.id; o.textContent = s.title;
      sel.appendChild(o);
    });
    if (prev==='' || seenIds[prev]) sel.value = prev;
  }
  $('filter-book').addEventListener('change', renderCuadernoList);
  $('btn-copy-all').addEventListener('click', function(e){
    var items = currentCuadernoItems();
    if (!items.length){ showToast('Todavía no tenés nada para copiar.'); return; }
    var text = items.map(formatEntryText).join('\n\n---\n\n');
    copyToClipboard(text, e.currentTarget);
  });

  function currentCuadernoItems(){
    if (activeEventId){
      return highlights.filter(function(h){ return h.eventId===activeEventId; });
    }
    var filter = $('filter-book').value;
    return filter ? highlights.filter(function(h){ return h.bookId===filter; }) : highlights;
  }

  function renderCuadernoView(){
    showView('cuaderno');
    populateFilterOptions();
    renderEventChips();
    renderCuadernoList();
  }

  function renderEventChips(){
    var wrap = $('event-chips');
    wrap.innerHTML = '';
    var todos = document.createElement('button');
    todos.type = 'button'; todos.className = 'event-chip' + (activeEventId===null ? ' active' : '');
    todos.textContent = 'Todos';
    todos.addEventListener('click', function(){ activeEventId = null; renderCuadernoView(); });
    wrap.appendChild(todos);

    events.forEach(function(ev){
      var chip = document.createElement('button');
      chip.type = 'button'; chip.className = 'event-chip' + (activeEventId===ev.id ? ' active' : '');
      chip.addEventListener('click', function(){ activeEventId = ev.id; renderCuadernoView(); });
      var label = document.createElement('span'); label.textContent = ev.title;
      var editBtn = document.createElement('span'); editBtn.className = 'event-chip-edit'; editBtn.textContent = '✏️';
      editBtn.addEventListener('click', function(e){ e.stopPropagation(); openEventModal(ev); });
      chip.appendChild(label); chip.appendChild(editBtn);
      wrap.appendChild(chip);
    });

    var newBtn = document.createElement('button');
    newBtn.type = 'button'; newBtn.className = 'event-chip-new'; newBtn.textContent = '+ Nuevo evento';
    newBtn.addEventListener('click', function(){ openEventModal(null); });
    wrap.appendChild(newBtn);
  }

  var eventModalContext = null;
  function openEventModal(existing){
    eventModalContext = existing;
    $('event-modal-title').textContent = existing ? 'Editar evento' : 'Nuevo evento';
    $('input-event-title').value = existing ? existing.title : '';
    $('btn-delete-event').hidden = !existing;
    $('modal-event').hidden = false;
    $('input-event-title').focus();
  }
  $('btn-cancel-event').addEventListener('click', function(){ $('modal-event').hidden = true; eventModalContext = null; });
  $('btn-save-event').addEventListener('click', function(){
    var title = $('input-event-title').value.trim();
    if (!title){ showToast('Ponele un nombre al evento.', 'error'); return; }
    if (!db) return;
    if (eventModalContext){
      db.collection('events').doc(eventModalContext.id).update({title: title}).then(function(){
        $('modal-event').hidden = true; eventModalContext = null; showToast('Evento actualizado.');
      }).catch(function(e){ console.error(e); showToast('No se pudo guardar.', 'error'); });
    } else {
      var id = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now())+Math.random().toString(16).slice(2));
      db.collection('events').doc(id).set({id:id, title:title, createdAt:Date.now()}).then(function(){
        $('modal-event').hidden = true; eventModalContext = null;
        activeEventId = id;
        renderCuadernoView();
      }).catch(function(e){ console.error(e); showToast('No se pudo crear el evento.', 'error'); });
    }
  });
  $('btn-delete-event').addEventListener('click', function(){
    if (!eventModalContext) return;
    var ev = eventModalContext;
    var toUnset = highlights.filter(function(h){ return h.eventId===ev.id; });
    Promise.all(toUnset.map(function(h){ return db.collection('highlights').doc(h.id).update({eventId:null}).catch(function(){}); }))
      .then(function(){ return db.collection('events').doc(ev.id).delete(); })
      .then(function(){
        $('modal-event').hidden = true; eventModalContext = null;
        if (activeEventId===ev.id) activeEventId = null;
        renderCuadernoView();
        showToast('Evento eliminado. Lo que tenías adentro quedó sin evento, no se borró.');
      }).catch(function(e){ console.error(e); showToast('No se pudo eliminar el evento.', 'error'); });
  });

  $('btn-add-event-note').addEventListener('click', function(){
    var text = $('input-event-note').value.trim();
    if (!text || !activeEventId || !db) return;
    var id = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now())+Math.random().toString(16).slice(2));
    db.collection('highlights').doc(id).set({
      bookId:null, bookTitle:null, page:null, text:null, note:text,
      tag:null, aiSummary:null, eventId:activeEventId, createdAt:Date.now()
    }).then(function(){
      $('input-event-note').value = '';
      showToast('Agregado al cuaderno.');
    }).catch(function(e){ console.error(e); showToast('No se pudo guardar.', 'error'); });
  });

  function renderCuadernoList(){
    var list = $('cuaderno-list');
    list.innerHTML = '';
    $('event-composer').hidden = !activeEventId;
    $('filter-book').style.display = activeEventId ? 'none' : '';
    if (!highlightsLoaded || !eventsLoaded){ list.appendChild(loadingState('Cargando tu cuaderno…')); return; }
    var items = currentCuadernoItems();
    if (!items.length){
      list.appendChild(activeEventId
        ? emptyState('Todavía no hay nada acá', 'Escribí algo arriba, o pasá un pasaje marcado a este evento desde su tarjeta.')
        : emptyState('Tu cuaderno está vacío', 'Marcá un pasaje mientras leés y va a aparecer acá, con tu nota o un resumen con IA si lo pedís.'));
      return;
    }
    items.forEach(function(h){ list.appendChild(highlightCard(h)); });
  }

  function formatEntryText(h){
    var out;
    if (h.bookId){
      out = '"' + h.text + '"\n— ' + h.bookTitle + ', pág. ' + h.page;
      if (h.aiSummary) out += '\nResumen: ' + h.aiSummary;
      if (h.note) out += '\nMi nota: ' + h.note;
    } else {
      out = h.note || '';
    }
    var ev = h.eventId ? events.filter(function(e){ return e.id===h.eventId; })[0] : null;
    if (ev) out += '\n[' + ev.title + ']';
    return out;
  }
  function copyToClipboard(text, btn){
    var done = function(){
      var orig = btn.textContent; btn.textContent = '¡Copiado!';
      setTimeout(function(){ btn.textContent = orig; }, 1500);
    };
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(done).catch(function(){ fallbackCopy(text, done); });
    } else fallbackCopy(text, done);
  }
  function fallbackCopy(text, done){
    var ta = document.createElement('textarea');
    ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.focus(); ta.select();
    try{ document.execCommand('copy'); done(); }
    catch(e){ showToast('No se pudo copiar. Seleccioná el texto manualmente.', 'error'); }
    document.body.removeChild(ta);
  }

  function tagDots(h){
    var wrap = document.createElement('div'); wrap.className = 'tag-dots';
    TAGS.forEach(function(t){
      var dot = document.createElement('button');
      dot.type = 'button';
      dot.className = 'tag-dot tag-dot-' + t.key + (h.tag===t.key ? ' active' : '');
      dot.title = t.label;
      dot.addEventListener('click', function(){
        var newTag = h.tag===t.key ? null : t.key;
        db.collection('highlights').doc(h.id).update({tag:newTag}).catch(function(){});
      });
      wrap.appendChild(dot);
    });
    return wrap;
  }

  function confirmDeleteHighlight(h, btn){
    if (btn.dataset.confirming){
      db.collection('highlights').doc(h.id).delete().then(function(){ showToast('Eliminado.'); })
        .catch(function(e){ console.error(e); showToast('No se pudo eliminar.', 'error'); });
      return;
    }
    btn.dataset.confirming = '1';
    var orig = btn.textContent; btn.textContent = '¿Seguro?';
    setTimeout(function(){ if (btn.dataset.confirming){ delete btn.dataset.confirming; btn.textContent = orig; } }, 3000);
  }

  function highlightCard(h){
    var card = document.createElement('div'); card.className = 'entry-card';

    var header = document.createElement('div'); header.className = 'entry-header';
    if (!activeEventId && h.eventId){
      var ev = events.filter(function(e){ return e.id===h.eventId; })[0];
      if (ev){ var evTag = document.createElement('span'); evTag.className = 'entry-event-tag'; evTag.textContent = '📁 ' + ev.title; header.appendChild(evTag); }
    }
    if (h.bookId){
      var bookLink = document.createElement('a'); bookLink.href = '#libro-' + h.bookId;
      bookLink.className = 'entry-book-link'; bookLink.textContent = h.bookTitle || 'Libro';
      bookLink.addEventListener('click', function(e){ e.preventDefault(); goToHighlightInBook(h); });
      var pageSpan = document.createElement('span'); pageSpan.textContent = 'pág. ' + h.page;
      header.appendChild(bookLink); header.appendChild(pageSpan);
    }
    var dateSpan = document.createElement('span'); dateSpan.textContent = formatDate(h.createdAt);
    header.appendChild(dateSpan);
    card.appendChild(header);

    if (h.bookId){
      var quote = document.createElement('blockquote'); quote.className = 'entry-quote'; quote.textContent = h.text;
      card.appendChild(quote);
    }
    card.appendChild(tagDots(h));

    if (h.aiSummary){
      var sBlock = document.createElement('div'); sBlock.className = 'entry-ai';
      var sLabel = document.createElement('div'); sLabel.className = 'entry-block-label'; sLabel.textContent = '✨ Resumen';
      var sText = document.createElement('p'); sText.textContent = h.aiSummary;
      sBlock.appendChild(sLabel); sBlock.appendChild(sText); card.appendChild(sBlock);
    }
    if (h.note){
      var nBlock = document.createElement('div'); nBlock.className = 'entry-note';
      var nLabel = document.createElement('div'); nLabel.className = 'entry-block-label'; nLabel.textContent = '📝 Mi nota';
      var nText = document.createElement('p'); nText.textContent = h.note;
      var editBtn = document.createElement('button'); editBtn.className = 'link-btn'; editBtn.type='button'; editBtn.textContent = 'Editar';
      editBtn.addEventListener('click', function(){ openNoteComposer(null, h.id); });
      nBlock.appendChild(nLabel); nBlock.appendChild(nText); nBlock.appendChild(editBtn);
      card.appendChild(nBlock);
    }

    var actions = document.createElement('div'); actions.className = 'entry-actions';
    if (!h.note){
      var addNoteBtn = document.createElement('button'); addNoteBtn.className = 'btn btn-ghost btn-sm'; addNoteBtn.type='button'; addNoteBtn.textContent = '+ Nota';
      addNoteBtn.addEventListener('click', function(){ openNoteComposer(null, h.id); });
      actions.appendChild(addNoteBtn);
    }
    if (h.bookId && !h.aiSummary){
      var addAiBtn = document.createElement('button'); addAiBtn.className = 'btn btn-ghost btn-sm'; addAiBtn.type='button'; addAiBtn.textContent = '✨ Resumen IA'; addAiBtn.hidden = true;
      addAiBtn.addEventListener('click', function(){ requestAiForExisting(h, addAiBtn); });
      actions.appendChild(addAiBtn);
    }
    if (events.length){
      var moveSel = document.createElement('select'); moveSel.className = 'entry-move-select';
      var optNone = document.createElement('option'); optNone.value=''; optNone.textContent='Sin evento'; moveSel.appendChild(optNone);
      events.forEach(function(ev){
        var o = document.createElement('option'); o.value = ev.id; o.textContent = '📁 ' + ev.title;
        if (h.eventId===ev.id) o.selected = true;
        moveSel.appendChild(o);
      });
      moveSel.addEventListener('change', function(){
        db.collection('highlights').doc(h.id).update({eventId: moveSel.value || null}).then(function(){
          showToast(moveSel.value ? 'Movido al evento.' : 'Quitado del evento.');
        }).catch(function(e){ console.error(e); showToast('No se pudo mover.', 'error'); });
      });
      actions.appendChild(moveSel);
    }
    var copyBtn = document.createElement('button'); copyBtn.className = 'btn btn-ghost btn-sm'; copyBtn.type='button'; copyBtn.textContent = 'Copiar';
    copyBtn.addEventListener('click', function(){ copyToClipboard(formatEntryText(h), copyBtn); });
    var delBtn = document.createElement('button'); delBtn.className = 'btn btn-ghost btn-sm btn-danger'; delBtn.type='button'; delBtn.textContent = 'Eliminar';
    delBtn.addEventListener('click', function(){ confirmDeleteHighlight(h, delBtn); });
    actions.appendChild(copyBtn); actions.appendChild(delBtn);
    card.appendChild(actions);
    return card;
  }

  // ---------- data subscriptions ----------
  function subscribeData(){
    db.collection('books').orderBy('addedAt','desc').onSnapshot(function(snap){
      books = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
      booksLoaded = true;
      renderRoute();
    }, function(err){ console.error(err); booksLoaded = true; renderRoute(); });

    db.collection('highlights').orderBy('createdAt','desc').onSnapshot(function(snap){
      highlights = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
      highlightsLoaded = true;
      renderRoute();
    }, function(err){ console.error(err); highlightsLoaded = true; renderRoute(); });

    db.collection('groups').onSnapshot(function(snap){
      groups = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
      groupsLoaded = true;
      renderRoute();
    }, function(err){ console.error(err); groupsLoaded = true; renderRoute(); });

    db.collection('events').orderBy('createdAt','asc').onSnapshot(function(snap){
      events = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
      eventsLoaded = true;
      if (activeEventId && !events.some(function(ev){ return ev.id===activeEventId; })) activeEventId = null;
      if (currentRoute()==='cuaderno') renderCuadernoView();
    }, function(err){ console.error(err); eventsLoaded = true; });
  }

  // ---------- init ----------
  var initDone = false;
  renderRoute(); // show loading state immediately

  Promise.all([
    window.claude && window.claude.use ? window.claude.use('db') : Promise.resolve(null),
    window.claude && window.claude.use ? window.claude.use('assets') : Promise.resolve(null),
    window.claude && window.claude.use ? window.claude.use('sample') : Promise.resolve(null)
  ]).then(function(results){
    db = results[0]; assetsCap = results[1]; sampleFn = results[2];
  }).catch(function(e){ console.error(e); })
  .finally(function(){
    initDone = true;
    if (db) subscribeData();
    else { booksLoaded = true; highlightsLoaded = true; }
    renderRoute();
  });
})();
</script>

</body></html>
